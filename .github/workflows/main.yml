
name: React CI/CD - WX Solucoes

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # JOB 1 - Analise de qualidade
  lint:
    name: Oxlint
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Mostrar versoes
        run: |
          node --version
          npm --version

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar qualidade
        run: npm run lint

  # JOB 2 - Compilacao do React
  build:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar React
        run: npm run build

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/

  # JOB 3 - Publicacao do site
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest

    needs: [lint, build]

    if: github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Baixar build
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
